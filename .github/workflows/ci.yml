name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests and static checks
        run: |
          go test -count=1 ./...
          go vet ./...
          go test -race ./...
      - name: Focused shell and release fixtures
        run: |
          fixture_workspace="$(readlink -f "$GITHUB_WORKSPACE")"
          if [ -e /workspace ] || [ -L /workspace ]; then
            test "$(readlink -f /workspace)" = "$fixture_workspace" || {
              echo "fixture workspace path is not the checked-out repository" >&2
              exit 1
            }
          else
            sudo ln -s "$fixture_workspace" /workspace
          fi
          bash -n scripts/*.sh
          bash scripts/test-benchmark-policy.sh
          bash scripts/test-c1.sh
          bash scripts/test-xkeen-foreground.sh
          bash scripts/test-components.sh
          bash scripts/test-appliance.sh
          bash scripts/test-backup.sh
          bash scripts/test-restore.sh
          bash scripts/test-restore-ui.sh
          bash scripts/test-release.sh
          bash scripts/test-public-hygiene.sh
      - name: Frontend install and checks
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run check
      - name: Embedded asset consistency
        run: |
          npm --prefix web run build
          diff -ru --strip-trailing-cr web/dist internal/webassets/dist
      - name: Static arm64 build and hygiene
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags='-s -w -X github.com/popiposter/xkeen-control/internal/buildinfo.Version=dev -X github.com/popiposter/xkeen-control/internal/buildinfo.Commit=dev -X github.com/popiposter/xkeen-control/internal/buildinfo.Channel=development' \
            -o dist/xkeen-control-linux-arm64 ./cmd/xkeen-control
          sha256sum dist/xkeen-control-linux-arm64
          git diff --check
      - name: Frontend dependency audit
        shell: bash
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT
          for attempt in 1 2 3; do
            : >"$audit_log"
            if npm --prefix web audit --audit-level=high \
              --fetch-retries=1 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=30000 2>&1 | tee "$audit_log"; then
              exit 0
            else
              status=$?
            fi
            if ! grep -Eqi 'network timeout|service unavailable|econnreset|etimedout|eai_again|audit endpoint returned an error|fetch failed' "$audit_log"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm audit advisory endpoint remained unavailable after 3 bounded attempts"
              exit "$status"
            fi
            echo "::warning::npm audit advisory endpoint unavailable; retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 2))
          done
