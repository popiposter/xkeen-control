name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify diff and check hygiene
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          is_docs_path() {
            case "$1" in
              docs/*) return 0 ;;
              *.md)
                case "$1" in
                  */*) return 1 ;;
                  *) return 0 ;;
                esac
                ;;
              *) return 1 ;;
            esac
          }

          # Keep the allowlist behavior explicit and fail the workflow if these
          # representative invariants are ever broken while editing this logic.
          is_docs_path docs/ROADMAP.md
          is_docs_path README.md
          ! is_docs_path .github/workflows/ci.yml
          ! is_docs_path scripts/test-release.sh
          ! is_docs_path internal/update/manager.go
          ! is_docs_path web/src/main.tsx

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              ;;
            *)
              echo "::warning::unknown CI event; requiring full qualification"
              echo "full=true" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "::warning::comparison base is unavailable; requiring full qualification"
              echo "full=true" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::comparison base is not present; requiring full qualification"
            echo "full=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check "$base" HEAD

          mapfile -t changed < <(git diff --no-renames --name-only "$base" HEAD)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "::warning::empty committed diff; requiring full qualification"
            echo "full=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          full=false
          printf 'changed paths:\n'
          for path in "${changed[@]}"; do
            printf '  %s\n' "$path"
            if ! is_docs_path "$path"; then
              full=true
            fi
          done

          echo "full=$full" >>"$GITHUB_OUTPUT"
          if [ "$full" = false ]; then
            echo "docs-only diff: heavy qualification lanes will be skipped"
          else
            echo "non-doc or mixed diff: full qualification required"
          fi

      - name: Docs-only public hygiene
        if: ${{ steps.classify.outputs.full == 'false' }}
        run: bash scripts/test-public-hygiene.sh

  go:
    name: go
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests and static checks
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Static arm64 build and hygiene
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags='-s -w -X github.com/popiposter/xkeen-control/internal/buildinfo.Version=dev -X github.com/popiposter/xkeen-control/internal/buildinfo.Commit=dev -X github.com/popiposter/xkeen-control/internal/buildinfo.Channel=development' \
            -o dist/xkeen-control-linux-arm64 ./cmd/xkeen-control
          sha256sum dist/xkeen-control-linux-arm64
          git diff --check

  race:
    name: race
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go race detector
        run: go test -race ./...

  fixtures:
    name: fixtures
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused shell and release fixtures
        run: |
          fixture_workspace="$(readlink -f "$GITHUB_WORKSPACE")"
          if [ -e /workspace ] || [ -L /workspace ]; then
            test "$(readlink -f /workspace)" = "$fixture_workspace" || {
              echo "fixture workspace path is not the checked-out repository" >&2
              exit 1
            }
          else
            sudo ln -s "$fixture_workspace" /workspace
          fi
          bash -n scripts/*.sh
          bash scripts/test-benchmark-policy.sh
          bash scripts/test-c1.sh
          bash scripts/test-xkeen-foreground.sh
          bash scripts/test-components.sh
          bash scripts/test-appliance.sh
          bash scripts/test-backup.sh
          bash scripts/test-restore.sh
          bash scripts/test-restore-ui.sh
          bash scripts/test-release.sh
          bash scripts/test-public-hygiene.sh

  frontend:
    name: frontend
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend install and checks
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run check
          (cd web && npx playwright install --with-deps chromium && npm run test:components-ui)
      - name: Embedded asset consistency
        run: |
          npm --prefix web run build
          diff -ru --strip-trailing-cr web/dist internal/webassets/dist
      - name: Frontend dependency audit
        shell: bash
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT
          for attempt in 1 2 3; do
            : >"$audit_log"
            if npm --prefix web audit --audit-level=high \
              --fetch-retries=1 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=30000 2>&1 | tee "$audit_log"; then
              exit 0
            else
              status=$?
            fi
            if ! grep -Eqi 'network timeout|service unavailable|econnreset|etimedout|eai_again|audit endpoint returned an error|fetch failed' "$audit_log"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm audit advisory endpoint remained unavailable after 3 bounded attempts"
              exit "$status"
            fi
            echo "::warning::npm audit advisory endpoint unavailable; retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 2))
          done

  qualification:
    name: qualification
    if: ${{ always() }}
    needs: [scope, go, race, fixtures, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the selected qualification path
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          GO_RESULT: ${{ needs.go.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          printf 'scope=%s full=%s go=%s race=%s fixtures=%s frontend=%s\n' \
            "$SCOPE_RESULT" "$FULL" "$GO_RESULT" "$RACE_RESULT" "$FIXTURES_RESULT" "$FRONTEND_RESULT"
          test "$SCOPE_RESULT" = success
          case "$FULL" in
            true)
              test "$GO_RESULT" = success
              test "$RACE_RESULT" = success
              test "$FIXTURES_RESULT" = success
              test "$FRONTEND_RESULT" = success
              ;;
            false)
              test "$GO_RESULT" = skipped
              test "$RACE_RESULT" = skipped
              test "$FIXTURES_RESULT" = skipped
              test "$FRONTEND_RESULT" = skipped
              ;;
            *)
              echo "scope classification is missing or invalid" >&2
              exit 1
              ;;
          esac
