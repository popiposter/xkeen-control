name: PR39 temporary asset build
on:
  push:
    branches: [codex/issue-4-phase-f2-components-ui]
permissions: {}
jobs:
  build:
    if: github.repository == 'popiposter/xkeen-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          (cd web && npx playwright install --with-deps chromium && npm run test:components-ui)
      - name: Package generated assets only
        run: |
          mkdir -p asset-result
          cp -R web/dist asset-result/dist
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('asset-result/source.json').write_text(json.dumps({'source': os.environ['GITHUB_SHA']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr39-embedded
          path: asset-result/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pr39-synthetic-screenshots
          path: /tmp/xkeen-control-playwright/**/*.png
          retention-days: 1
          if-no-files-found: error
  blobs:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout or repository/dependency code runs in this job. It stores
    # bounded generated files as Git blobs only; it does not update refs here.
    # This temporary workflow is deleted before final PR qualification.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr39-embedded
          path: generated
      - name: Store generated Git objects without committing or pushing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          root = Path('generated')
          assert json.loads((root / 'source.json').read_text()) == {'source': os.environ['GITHUB_SHA']}
          files = sorted(p for p in (root / 'dist').rglob('*') if p.is_file())
          assert 1 <= len(files) <= 32
          total = 0
          entries = []
          for p in files:
              name = p.relative_to(root / 'dist').as_posix()
              assert not p.is_symlink()
              assert name == 'index.html' or re.fullmatch(r'assets/[A-Za-z0-9._-]+\.(js|css|svg)', name)
              data = p.read_bytes()
              total += len(data)
              assert len(data) <= 1048576 and total <= 3145728
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/popiposter/xkeen-control/git/blobs', data=payload, method='POST', headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              entries.append({'path': 'internal/webassets/dist/' + name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          print('ASSET_SOURCE=' + os.environ['GITHUB_SHA'])
          print('ASSET_ENTRIES=' + json.dumps(entries, separators=(',', ':')))
          PY
