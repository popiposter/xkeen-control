syntax = "proto3";

package xray.common.serial;

option go_package = "github.com/popiposter/xkeen-keenetic/internal/xrayapi;xrayapi";

// Minimal copy of Xray-core v26.3.27 common/serial/TypedMessage.  The Go
// package is intentionally shared with this repository's small API subset;
// the protobuf full name remains the upstream one for Any-style dispatch.
message TypedMessage {
  string type = 1;
  bytes value = 2;
}
